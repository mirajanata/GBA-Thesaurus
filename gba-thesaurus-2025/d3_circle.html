<!DOCTYPE html>
<html style="height: 100%">
<head>
    <meta charset="UTF-8">
    <title>Circle Packing - ECharts</title>
    <!-- ECharts library -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body style="height: 100%; margin: 0">
    <!-- Chart container -->
    <div id="main" style="height: 100%"></div>

    <script>
        // JSON data for circle-packing
        const data = {
            "id": "Weathering Phenomenon",
            "name": "Weathering Phenomenon",
            "children": [
                {
                    "id": "Pipe-like weathering structure",
                    "name": "Pipe-like weathering structure",
                    "value": 1
                },
                {
                    "id": "Spheroidal weathering",
                    "name": "Spheroidal weathering",
                    "value": 1
                }
            ]
        };

        // Initialize chart
        const chart = echarts.init(document.getElementById('main'));

        // Chart options
        const option = {
            tooltip: {
                trigger: 'item',
                formatter: '{b}'
            },
            series: {
                type: 'circlePacking',
                data: [data],
                radius: [0, '100%'],
                label: {
                    show: true,
                    formatter: '{b}',
                    fontSize: 14
                },
                itemStyle: {
                    borderWidth: 1,
                    borderColor: '#fff'
                }
            }
        };

        // Render the chart
        chart.setOption(option);
    </script>
</body>
</html>
